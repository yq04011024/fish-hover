<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 抖音媒体经本地代理 http://127.0.0.1 转发（CDN 直连会 403），CSP 需放行本地代理；封面图走 https -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src https: data: http://127.0.0.1:* http://localhost:*; media-src https: http://127.0.0.1:* http://localhost:*; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<meta name="referrer" content="no-referrer">
<title>抖音视频</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #000; color: #fff; padding: 16px; overflow: auto;
  }
  .pane {
    width: __PANE_WIDTH__px; max-width: 100%; margin: 0 auto;
    background: #16181d; border-radius: 12px; overflow: hidden;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
    resize: horizontal; min-width: 200px;
  }
  /* 视频画面区：默认被遮罩盖住，聚焦/悬停时淡出显示画面、失焦恢复伪装 */
  .screen { position: relative; width: 100%; height: 600px; background: #000; }
  .screen video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .veil {
    position: absolute; inset: 0; background: #000; overflow: hidden;
    user-select: none; transition: opacity 0.3s ease; z-index: 2;
  }
  .screen:hover .veil { opacity: 0; pointer-events: none; }
  /* 伪装代码内容（编辑器风格，与 B站伪装面板完全一致） */
  .disguise {
    font-family: Consolas, 'Courier New', monospace;
    font-size: 12px; line-height: 1.55; color: #d4d4d4;
    background: #1e1e1e; padding: 10px 0; height: 100%; overflow: hidden;
  }
  .disguise .cl { display: flex; white-space: pre; }
  .disguise .ln {
    width: 44px; min-width: 44px; text-align: right; padding-right: 12px;
    color: #6e7681; background: #1e1e1e;
  }
  .disguise .ct { flex: 1; padding-right: 10px; }
  /* 状态条（加载中/错误），叠加在画面底部 */
  .load-status {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 5px 12px; background: rgba(20, 20, 20, 0.82);
    color: #9aa0a6; font-size: 12px; display: none; z-index: 3;
  }
  .stream-error {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 5px 12px; background: rgba(120, 30, 30, 0.85);
    color: #ffd7d7; font-size: 12px; display: none; z-index: 3;
  }
  /* 视频信息区 */
  .meta { padding: 14px 16px 16px; }
  .meta h2 { font-size: 16px; font-weight: 600; line-height: 1.45; margin-bottom: 8px; }
  .meta .byline { color: #9aa0a6; font-size: 13px; margin-bottom: 8px; }
  .meta .stats { display: flex; gap: 16px; color: #8a9096; font-size: 12px; margin-bottom: 10px; }
  .actions { padding: 0 16px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .actions button {
    background: #fe2c55; color: #fff; border: none; border-radius: 16px;
    padding: 8px 18px; font-size: 13px; cursor: pointer;
  }
  .actions button:hover { background: #ff506f; }
  .actions button.ghost { background: transparent; border: 1px solid rgba(255,255,255,.35); color: #fff; }
  .actions button.ghost:hover { border-color: #fff; background: rgba(255,255,255,.08); }
  .actions button:disabled { opacity: .55; cursor: not-allowed; }
  /* 画面右上角悬浮下载入口（层级高于遮罩，无需向下滚动即可见） */
  .screen-actions { position: absolute; top: 10px; right: 10px; z-index: 5; display: flex; gap: 8px; }
  .icon-btn {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(0,0,0,.62); color: #fff; border: 1px solid rgba(255,255,255,.25);
    border-radius: 16px; padding: 6px 13px; font-size: 12px; cursor: pointer;
    backdrop-filter: blur(4px); transition: background .2s ease, border-color .2s ease;
  }
  .icon-btn:hover { background: #fe2c55; border-color: #fe2c55; }
  .icon-btn:disabled { opacity: .55; cursor: not-allowed; background: rgba(0,0,0,.62); border-color: rgba(255,255,255,.25); }
  .icon-btn svg { width: 13px; height: 13px; fill: currentColor; }
  /* 下载进度条 */
  .dl-progress { width: 100%; display: none; }
  .dl-progress.show { display: block; }
  .dl-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; }
  .dl-bar > i { display: block; height: 100%; width: 0; background: #fe2c55; border-radius: 3px;
    transition: width .25s ease; }
  .dl-bar.indeterminate > i { width: 40% !important; animation: dl-slide 1.1s ease-in-out infinite; }
  @keyframes dl-slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  .dl-text { margin-top: 5px; font-size: 12px; color: #9aa0a6; }
  .dl-text.error { color: #ff8a8a; }
  .dl-text.done { color: #7ee2a8; }
</style>
</head>
<body>
<div class="pane" id="pane">
  <div class="screen" id="screen">
    <div class="screen-actions">
      <button class="icon-btn" id="downloadBtnTop" title="下载该视频到本地">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        <span id="downloadBtnTopText">下载</span>
      </button>
    </div>
    <video id="player" preload="auto" playsinline __AUTO_START__></video>
    <div class="veil" id="veil">__DISGUISE_HTML__</div>
    <div class="load-status" id="loadStatus"></div>
    <div class="stream-error" id="streamError"></div>
  </div>
  <div class="meta">
    <h2 id="videoTitle"></h2>
    <div class="byline" id="videoByline"></div>
    <div class="stats">
      <span id="videoDigg"></span>
      <span id="videoComment"></span>
      <span id="videoShare"></span>
      <span id="videoDuration"></span>
    </div>
  </div>
  <div class="actions">
    <button id="downloadBtn">下载视频</button>
    <button id="openOnSite" class="ghost">去抖音观看</button>
    <div class="dl-progress" id="dlProgress">
      <div class="dl-bar" id="dlBar"><i id="dlFill"></i></div>
      <div class="dl-text" id="dlText"></div>
    </div>
  </div>
</div>
<script>
  const vscode = acquireVsCodeApi();
  const entry = __ENTRY__;
  const player = document.getElementById('player');
  const streamError = document.getElementById('streamError');

  document.getElementById('videoTitle').textContent = entry.title;
  document.getElementById('videoByline').textContent = '@' + entry.author;
  document.getElementById('videoDigg').textContent = '点赞 ' + entry.diggText;
  document.getElementById('videoComment').textContent = '评论 ' + entry.commentText;
  document.getElementById('videoShare').textContent = '分享 ' + entry.shareText;
  document.getElementById('videoDuration').textContent = '时长 ' + entry.durationText;
  if (entry.cover) {
    player.poster = entry.cover; // 加载播放流前先展示封面
  }

  player.volume = __VOLUME__;
  player.controls = true;

  document.getElementById('openOnSite').addEventListener('click', () => {
    vscode.postMessage({ command: 'dypane:openOnSite' });
  });

  // ---------- 下载 ----------
  const downloadBtn = document.getElementById('downloadBtn');
  const downloadBtnTop = document.getElementById('downloadBtnTop');
  const downloadBtnTopText = document.getElementById('downloadBtnTopText');
  const dlProgress = document.getElementById('dlProgress');
  const dlBar = document.getElementById('dlBar');
  const dlFill = document.getElementById('dlFill');
  const dlText = document.getElementById('dlText');
  let downloading = false;

  function formatBytes(n) {
    n = Number(n) || 0;
    if (n >= 1073741824) return (n / 1073741824).toFixed(2) + ' GB';
    if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
    if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
    return n + ' B';
  }

  function setDlBusy(text) {
    downloading = true;
    downloadBtn.disabled = true;
    downloadBtn.textContent = '下载中…';
    downloadBtnTop.disabled = true;
    downloadBtnTopText.textContent = '下载中';
    dlProgress.classList.add('show');
    dlText.className = 'dl-text';
    dlText.textContent = text || '准备下载…';
  }
  function setDlIdle(text) {
    downloading = false;
    downloadBtn.disabled = false;
    downloadBtn.textContent = '下载视频';
    downloadBtnTop.disabled = false;
    downloadBtnTopText.textContent = '下载';
    if (text) {
      dlText.className = 'dl-text';
      dlText.textContent = text;
    }
  }

  function startDownload() {
    if (downloading) { return; }
    setDlBusy('请选择保存位置…');
    // 宿主弹保存对话框；取消时会回 state=idle
    vscode.postMessage({ command: 'dypane:downloadVideo', awemeId: entry.awemeId, retryIndex: 0 });
  }
  downloadBtn.addEventListener('click', startDownload);
  downloadBtnTop.addEventListener('click', startDownload);

  // 面板宽度拖拽记忆（防抖后上报，与 B站伪装面板共用宽度配置）
  const pane = document.getElementById('pane');
  if (window.ResizeObserver) {
    let widthReportTimer = null;
    new ResizeObserver((entriesObs) => {
      const width = Math.round(entriesObs[0].contentRect.width);
      clearTimeout(widthReportTimer);
      widthReportTimer = setTimeout(() => {
        vscode.postMessage({ command: 'pane:persistWidth', width });
      }, 500);
    }).observe(pane);
  }

  // 拉取播放流：抖音同一视频常带多条 mp4 直链，播放失败时按 retryIndex 逐一切换备选地址
  const loadStatus = document.getElementById('loadStatus');
  let currentRetry = 0;
  let lastReadyRetry = -1;

  function showLoading(text) {
    streamError.style.display = 'none';
    loadStatus.textContent = text;
    loadStatus.style.display = 'block';
  }
  function hideStatus() {
    loadStatus.style.display = 'none';
    streamError.style.display = 'none';
  }
  function requestStream(retryIndex) {
    currentRetry = retryIndex;
    showLoading(retryIndex > 0 ? `正在切换备用线路 ${retryIndex + 1}…` : '正在获取视频流…');
    vscode.postMessage({ command: 'dypane:requestStream', awemeId: entry.awemeId, retryIndex });
  }

  // 视频元素自身加载失败（如某条 CDN 链接 403/失效）：自动尝试下一条直链
  player.addEventListener('error', () => {
    if (currentRetry + 1 < (entry.playUrlCount || 0)) {
      requestStream(currentRetry + 1);
    } else {
      loadStatus.style.display = 'none';
      streamError.textContent = '视频流加载出错（链接可能已失效），可点击「去抖音观看」';
      streamError.style.display = 'block';
    }
  });

  window.addEventListener('message', (event) => {
    const msg = event.data;
    if (!msg || typeof msg.command !== 'string') { return; }
    // 丢弃过期响应（快速切换视频时旧视频的取流结果可能晚到）
    if (msg.awemeId && msg.awemeId !== entry.awemeId) { return; }
    if (msg.command === 'dypane:streamReady') {
      const retryIndex = Number(msg.retryIndex) || 0;
      if (retryIndex === lastReadyRetry) { return; }
      lastReadyRetry = retryIndex;
      hideStatus();
      player.src = msg.url;
      player.play().catch(() => {});
    } else if (msg.command === 'dypane:streamError') {
      loadStatus.style.display = 'none';
      streamError.textContent = '播放失败：' + (msg.message || '未知错误') + '，可点击「去抖音观看」';
      streamError.style.display = 'block';
    } else if (msg.command === 'dypane:downloadState') {
      dlProgress.classList.add('show');
      if (msg.state === 'idle') {
        // 用户在保存对话框取消
        dlProgress.classList.remove('show');
        setDlIdle('');
      } else if (msg.state === 'progress') {
        setDlBusy();
        const percent = Number(msg.percent) || 0;
        if (msg.total) {
          dlBar.classList.remove('indeterminate');
          dlFill.style.width = percent + '%';
          downloadBtnTopText.textContent = percent + '%';
          dlText.textContent = (msg.message ? msg.message + ' ' : '')
            + `下载中 ${percent}%（${formatBytes(msg.received)} / ${formatBytes(msg.total)}）`;
        } else {
          // 服务端未给 content-length：显示不确定进度条 + 已下载字节
          dlBar.classList.add('indeterminate');
          downloadBtnTopText.textContent = '下载中';
          dlText.textContent = (msg.message ? msg.message + ' ' : '')
            + `下载中… 已下载 ${formatBytes(msg.received)}`;
        }
      } else if (msg.state === 'done') {
        dlBar.classList.remove('indeterminate');
        dlFill.style.width = '100%';
        dlText.className = 'dl-text done';
        dlText.textContent = '已保存到：' + (msg.filePath || '');
        setDlIdle();
        downloadBtnTopText.textContent = '已保存';
      } else if (msg.state === 'error') {
        dlBar.classList.remove('indeterminate');
        dlText.className = 'dl-text error';
        dlText.textContent = '下载失败：' + (msg.message || '未知错误');
        setDlIdle();
        downloadBtnTopText.textContent = '重试下载';
      }
    }
  });

  requestStream(0);
</script>
</body>
</html>
